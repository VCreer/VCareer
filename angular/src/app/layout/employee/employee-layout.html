<div class="employee-layout">
  <app-header-wrapper></app-header-wrapper>
  <div class="layout-container">
    <app-sidebar [show]="sidebarExpanded" (close)="onSidebarClose()"></app-sidebar>
    <main class="main-content" [class.sidebar-expanded]="sidebarExpanded">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Unauthorized Modal -->
  <app-generic-modal
    [show]="showUnauthorizedModal"
    [showCloseButton]="false"
    [maxWidth]="'420px'"
    (close)="onCloseUnauthorizedModal()"
  >
    <div class="unauthorized-modal-body">
      <div class="error-icon">
        <i class="fa fa-times"></i>
      </div>
      <h3 class="error-title">Bạn không có quyền truy cập trang này.</h3>
      <div class="modal-actions">
        <app-button type="primary" (click)="onCloseUnauthorizedModal()">Close</app-button>
      </div>
    </div>
  </app-generic-modal>
</div>
