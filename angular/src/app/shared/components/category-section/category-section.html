<section class="category-section">
  <div class="container">
    <div class="section-header">
      <h2>{{ translate('home.browse_categories') }}</h2>
      <div class="category-navigation">
        <button class="nav-btn prev-btn" (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15,18 9,12 15,6"></polyline>
          </svg>
        </button>
        <button class="nav-btn next-btn" (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === totalPages">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9,18 15,12 9,6"></polyline>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="category-grid">
      <div class="category-card" *ngFor="let category of categories" (click)="onCategoryClick(category.id)">
        <h3 class="category-name">{{ translate(category.name) }}</h3>
      </div>
    </div>
    
    <!-- Pagination - chỉ hiển thị khi có hơn 1 trang -->
    <app-pagination
      *ngIf="totalPages > 1"
      [currentPage]="currentPage"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)"
    ></app-pagination>
  </div>
</section>
