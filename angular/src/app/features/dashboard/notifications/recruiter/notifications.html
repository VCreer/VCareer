<div class="notifications-page" [style.padding-left]="getContentPaddingLeft()">
  <!-- Breadcrumb Box -->
  <div class="breadcrumb-box"
       [style.left.px]="sidebarWidth"
       [style.width]="'calc(100% - ' + sidebarWidth + 'px)'">
    <div class="breadcrumb-container">
      <h1 class="page-title">Thông báo</h1>
      <div class="header-actions">
        <button 
          class="btn-delete-all" 
          *ngIf="totalCount > 0"
          (click)="deleteAllNotifications()">
          <i class="fa fa-trash"></i>
          Xóa tất cả
        </button>
        <button 
          class="btn-mark-all-read" 
          *ngIf="unreadCount > 0"
          (click)="markAllAsRead()">
          <i class="fa fa-check-double"></i>
          Đánh dấu tất cả đã đọc
        </button>
      </div>
    </div>
  </div>

  <div class="notifications-container" [style.max-width]="getContentMaxWidth()">

    <!-- Filters -->
    <div class="notifications-filter" *ngIf="!isLoading">
      <div class="filter-group">
        <label for="statusFilter">Trạng thái</label>
        <select id="statusFilter" [value]="filterStatus" (change)="onFilterChange($any($event.target).value)">
          <option value="all">Tất cả</option>
          <option value="unread">Chưa đọc</option>
          <option value="read">Đã đọc</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="typeFilter">Loại thông báo</label>
        <select id="typeFilter" [value]="filterType" (change)="onTypeFilterChange($any($event.target).value)">
          <option value="all">Tất cả</option>
          <option value="candidate">Thông báo từ ứng viên</option>
          <option value="system">Thông báo hệ thống</option>
        </select>
      </div>
    </div>

    <!-- Stats -->
    <div class="notifications-stats" *ngIf="!isLoading">
      <span class="stat-item">
        Tổng: <strong>{{ totalCount }}</strong> thông báo
      </span>
    </div>

    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
      <p>Đang tải thông báo...</p>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!isLoading && notifications.length === 0">
      <i class="fa fa-bell-slash"></i>
      <p>Không có thông báo nào</p>
    </div>

    <!-- Notification List -->
    <div class="notifications-list" *ngIf="!isLoading && notifications.length > 0">
      <div 
        class="notification-card" 
        *ngFor="let notification of notifications"
        [class.unread]="!notification.isRead">
        
        <div class="notification-content">
          <div class="notification-header">
            <h3 class="notification-title">{{ notification.title }}</h3>
            <span class="type-badge">{{ getTypeLabel(notification) }}</span>
          </div>
          <p class="notification-message">{{ notification.message }}</p>
          <div class="notification-footer">
            <span class="notification-date">
              <i class="fa fa-clock-o"></i>
              {{ formatDate(notification.creationTime) }}
            </span>
            <div class="notification-actions">
              <button 
                class="btn-open"
                *ngIf="notification.notificationType === 'ApplicationSubmitted'"
                (click)="openCvManagement(notification)">
                Mở quản lý CV
              </button>
              <button class="btn-delete" (click)="deleteNotification(notification)">
                <i class="fa fa-trash"></i>
              </button>
              <span class="status-label" *ngIf="!notification.isRead">Mới</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination-wrapper" *ngIf="!isLoading && totalPages > 1">
      <app-pagination
        [currentPage]="currentPage + 1"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event - 1)">
      </app-pagination>
    </div>
  </div>

  <!-- Toast Notification -->
  <app-toast-notification
    [show]="showToast"
    [message]="toastMessage"
    [type]="toastType"
    (close)="showToast = false">
  </app-toast-notification>
</div>
