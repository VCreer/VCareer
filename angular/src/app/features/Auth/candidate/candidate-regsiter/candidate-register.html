<div class="register-container">
    <div class="register-wrapper">
      <!-- Cột bên trái - Ảnh -->
      <div class="register-image-section"></div>
  
      <!-- Cột bên phải - Form đăng ký -->
      <div class="register-form-section">
        <div class="register-card">
          <!-- Header -->
          <div class="register-header">
            <div class="logo-container">
              <img src="assets/images/login/logo-login.png" alt="VCareer Logo" class="logo-image" />
            </div>
            <h1 class="register-title">Tạo tài khoản mới</h1>
            <p class="welcome-text">Tham gia cùng chúng tôi để khám phá cơ hội nghề nghiệp tuyệt vời.</p>
          </div>
  
          <!-- Form đăng ký -->
          <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
            <!-- Hàng tên -->
            <div class="form-row">
              <div class="form-group">
                <app-input-field
                  label="Họ"
                  placeholder="Nhập họ của bạn"
                  [error]="getFieldError('firstName')"
                  [required]="true"
                  formControlName="firstName"
                ></app-input-field>
              </div>
              <div class="form-group">
                <app-input-field
                  label="Tên"
                  placeholder="Nhập tên của bạn"
                  [error]="getFieldError('lastName')"
                  [required]="true"
                  formControlName="lastName"
                ></app-input-field>
              </div>
            </div>
  
            <!-- Email -->
            <app-input-field
              label="Email"
              placeholder="Nhập email của bạn"
              type="email"
              icon="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4ZM22 6L12 13L2 6"
              [error]="getFieldError('email')"
              [required]="true"
              formControlName="email"
            ></app-input-field>

            <!-- Mật khẩu -->
            <app-password-field
              label="Mật khẩu"
              placeholder="Nhập mật khẩu"
              [error]="getFieldError('password')"
              [required]="true"
              formControlName="password"
            ></app-password-field>
  
            <!-- Xác nhận mật khẩu -->
            <app-password-field
              label="Xác nhận mật khẩu"
              placeholder="Nhập lại mật khẩu"
              [error]="getFieldError('confirmPassword')"
              [required]="true"
              formControlName="confirmPassword"
            ></app-password-field>
  
            <!-- Điều khoản -->
            <div class="form-group">
              <label class="terms-agreement">
                <input
                  type="checkbox"
                  formControlName="termsAgreement"
                  class="terms-input"
                />
                <span class="terms-text">
                  Tôi đồng ý với 
                  <a (click)="navigateToTermsOfService($event)" class="terms-link">Điều khoản dịch vụ</a> 
                  và 
                  <a href="#" class="terms-link">Chính sách bảo mật</a>
                </span>
              </label>
              <div *ngIf="hasFieldError('termsAgreement')" class="error-message">
                {{ getFieldError('termsAgreement') }}
              </div>
            </div>
  
            <!-- Nút đăng ký -->
            <app-button
              type="primary"
              size="medium"
              [fullWidth]="true"
              buttonType="submit"
              [loading]="isLoading"
            >
              Đăng ký
            </app-button>
          </form>
  
          <!-- Link đăng nhập -->
          <div class="login-section">
            <p class="login-text">
              Đã có tài khoản? 
              <button type="button" class="login-link" (click)="navigateToLogin()">
                Đăng nhập ngay
              </button>
            </p>
          </div>
        </div>
      </div>
    </div>
  
    <!-- Toast Notification -->
    <app-toast-notification
      [show]="showToast"
      [message]="toastMessage"
      [type]="toastType"
      (close)="showToast = false"
    ></app-toast-notification>
  </div>
